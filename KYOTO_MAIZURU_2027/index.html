<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>京都行程 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<script>
  try {
    var s = JSON.parse(localStorage.getItem("kyoto2027-state") || "{}");
    if (s.theme) document.documentElement.dataset.theme = s.theme;
    if (s.lang === "ja") document.documentElement.lang = "ja";
  } catch (e) {}
</script>
<script src="js/vue.global.prod.js"></script>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#24211d; --muted:#6f685e; --line:#e4ddd1;
  --accent:#b8442f; --accent-soft:#f6e3dc; --indigo:#2f4a6d; --indigo-soft:#e3e9f2;
  --green:#3d6b4a; --green-soft:#e2eee4; --amber:#9a6a12; --amber-soft:#f6ecd5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC",serif;
}
:root[lang="ja"]{
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --serif:"Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151a; --card:#211f25; --ink:#ece7df; --muted:#a49c90; --line:#35323a;
    --accent:#e57a62; --accent-soft:#3a2622; --indigo:#8fb0dc; --indigo-soft:#232c3a;
    --green:#8cc39a; --green-soft:#1f2e24; --amber:#e0b45a; --amber-soft:#332a18;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16151a; --card:#211f25; --ink:#ece7df; --muted:#a49c90; --line:#35323a;
  --accent:#e57a62; --accent-soft:#3a2622; --indigo:#8fb0dc; --indigo-soft:#232c3a;
  --green:#8cc39a; --green-soft:#1f2e24; --amber:#e0b45a; --amber-soft:#332a18;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.85;font-size:17px;
  -webkit-font-smoothing:antialiased;overflow-x:clip;overflow-wrap:break-word}
a{color:var(--indigo)}
img,iframe,table{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:0 0 auto}

header.hero{padding-top:72px;padding-bottom:48px;position:relative}
header.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-soft) 0%,transparent 70%);z-index:-1;pointer-events:none}
.eyebrow{font-size:14px;letter-spacing:.3em;color:var(--accent);font-weight:700;margin:0 0 10px}
.hero h1{font-family:var(--serif);font-size:46px;line-height:1.3;margin:0 0 12px;letter-spacing:.06em;font-weight:700}
.hero .sub{color:var(--muted);margin:0;font-size:18px}
.flights{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:36px}
.flight{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.flight .lab{font-size:14px;color:var(--muted);letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.flight .route{display:flex;align-items:center;gap:14px;margin-top:6px}
.flight .tm{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.flight .ap{font-size:14px;color:var(--muted)}
.flight .arrow{flex:1;height:2px;background:var(--line);position:relative;margin:0 4px}
.flight .arrow::after{content:"✈";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:var(--accent);background:var(--card);padding:0 8px;font-size:18px}
.flight .no{font-size:15px;font-weight:600;color:var(--accent);margin-top:8px}

nav.days{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 0}
.navrow{display:flex;flex-wrap:wrap;gap:8px;position:relative}
nav.days a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:15px;
  padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);transition:.15s;white-space:nowrap}
nav.days a:hover{border-color:var(--accent);color:var(--accent)}
nav.days a.active{background:var(--accent);border-color:var(--accent);color:#fff}

section{margin:72px 0;scroll-margin-top:84px}
h2{font-family:var(--serif);font-size:28px;margin:0 0 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;letter-spacing:.04em}
h2 .ic{color:var(--accent);width:28px;height:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:32px}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:14px;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
.tbl-scroll{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.day-body>*,.grid2>*{min-width:0}
.map-frame{width:100%;height:380px;border:0;border-radius:16px;display:block;background:var(--line)}

.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:32px 36px 0}
.day-num{font-size:15px;font-weight:700;color:#fff;background:var(--accent);padding:4px 14px;border-radius:999px;letter-spacing:.05em}
.day-title{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.03em}
.day-date{color:var(--muted);font-size:17px;display:inline-flex;align-items:center;gap:6px}
.badge{font-size:14px;padding:3px 12px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-opt{background:var(--indigo-soft);color:var(--indigo)}
.stay{margin:12px 36px 0;font-size:16px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stay b{color:var(--ink)}
.day-body{display:grid;grid-template-columns:1.15fr 1fr;gap:44px;padding:28px 36px 32px}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:72px 14px minmax(0,1fr);column-gap:16px;padding:12px 0;position:relative}
.tl li::before{content:"";grid-column:2;grid-row:1;justify-self:center;align-self:start;margin-top:7px;width:14px;height:14px;
  border-radius:50%;background:var(--card);border:3px solid var(--accent);position:relative;z-index:1}
.tl li::after{content:"";position:absolute;left:94px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child::after{top:26px}
.tl li.move:first-child::after{top:16px}
.tl li:last-child::after{bottom:auto;height:26px}
.tl li.move:last-child::after{height:16px}
.tl li.move{padding:4px 0}
.tl li.move::before{width:8px;height:8px;margin-top:8px;border:none;background:color-mix(in srgb,var(--indigo) 60%,var(--card))}
.tl .t{grid-column:1;grid-row:1;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;color:var(--accent);padding-top:3px;text-align:right;line-height:1.4}
.tl .what{grid-column:3;grid-row:1}
.tl .what b{display:block;font-size:18px;font-weight:600;line-height:1.6}
.tl .what span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.tl li.move .what b{color:var(--indigo);font-weight:500;font-size:15.5px}
.tl li.move .what b .ic{margin-right:6px}
.tl li.move .what span{font-size:14px}

.legs{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.leg{display:flex;align-items:center;gap:12px;font-size:16px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);background:var(--bg);transition:.15s}
.leg:hover{border-color:var(--indigo);transform:translateX(2px)}
.leg .m{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);flex:0 0 auto}
.leg .m.walk{background:var(--green-soft);color:var(--green)}
.leg .lbl{flex:1;min-width:0}
.leg .go{color:var(--indigo);font-weight:600;flex:0 0 auto;font-size:15px;display:inline-flex;align-items:center;gap:4px}
.side h4{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.notes{margin:0 36px 36px;padding:20px 24px;border-radius:16px;background:var(--amber-soft);font-size:16px;line-height:1.85}
.notes p{margin:10px 0;display:flex;gap:10px}
.notes p .ic{color:var(--amber);margin-top:.35em}
.notes b{color:var(--amber)}
.plan-tabs{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.plan-tabs button{font:inherit;font-size:15px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.plan-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.check-group{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:40px 0 14px;display:flex;align-items:center;gap:14px}
.check-group::after{content:"";flex:1;height:1px;background:var(--line)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.check li{display:grid;grid-template-columns:auto 132px minmax(0,1fr);gap:24px;align-items:start;
  padding:24px 28px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:.15s}
.check li:hover{border-color:var(--accent)}
.check input{width:22px;height:22px;margin-top:6px;accent-color:var(--accent);cursor:pointer}
.check label{cursor:pointer}
.check .date-blk{display:flex;flex-direction:column;padding-right:20px;border-right:1px solid var(--line);min-height:100%}
.check .date-blk .d{font-size:24px;font-weight:700;color:var(--accent);line-height:1.25;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.check .date-blk .s{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.check .body{display:block}
.check .ttl{font-weight:600;font-size:18px;margin-right:10px}
.check .body .badge{vertical-align:2px}
.check .ds{display:block;font-size:15.5px;color:var(--muted);margin-top:8px;line-height:1.8}
.check li.done{opacity:.5}
.check li.done .ttl{text-decoration:line-through}
.prog{font-family:var(--sans);font-size:15px;color:var(--muted);margin-left:auto;font-weight:500}
.tips{margin:0;padding:0;list-style:none}
.tips li{margin:0;padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}
.tips li:last-child{border-bottom:none}
.tips li .ic{color:var(--accent);margin-top:.35em;width:20px;height:20px}
.small{font-size:15px;color:var(--muted)}
.foot{height:80px}

.fab{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:10px}
.fab-btn{position:relative;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:.15s}
.fab-btn:hover{border-color:var(--accent);color:var(--accent)}
.fab-btn .ic{width:22px;height:22px}
.fab-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fab-menu{display:flex;flex-direction:column;gap:10px}
.fab-dot{position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.shop{display:flex;flex-direction:column;gap:6px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:.15s}
.shop:hover{border-color:var(--accent)}
.shop .nm{font-weight:600;font-size:18px}
.shop .ds{font-size:15px;color:var(--muted);line-height:1.7;flex:1}
.shop .hr{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.shop .hr .ic{width:16px;height:16px}
.shop .go{color:var(--indigo);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.fab-lab{position:absolute;right:-2px;bottom:-2px;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;
  min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 4px}

@media (max-width:1120px){
  header.hero{overflow:hidden}
}
@media (max-width:960px){
  .day-body,.grid2{grid-template-columns:minmax(0,1fr)}
  .navrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
  .navrow::-webkit-scrollbar{display:none}
  .navrow::after{content:"";flex:0 0 24px}
  nav.days a{scroll-snap-align:center}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  header.hero{padding-top:44px;padding-bottom:28px}
  header.hero::after{width:300px;height:300px;right:-110px;top:-90px}
  .hero h1{font-size:32px}
  .flights{grid-template-columns:minmax(0,1fr);gap:14px}
  .flight{padding:18px 20px}
  .flight .tm{font-size:24px}
  nav.days{padding:10px 0}
  nav.days a{font-size:14px;padding:7px 14px}
  section{margin:48px 0;scroll-margin-top:72px}
  h2{font-size:23px}
  .pad{padding:20px}
  th,td{padding:12px 8px}
  table.stack thead{display:none}
  table.stack tr{display:block;padding:16px 0;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:none}
  table.stack td{display:block;padding:2px 0;border:none}
  table.stack td:first-child{display:inline;color:var(--accent);font-weight:600}
  table.stack td:nth-child(2){display:inline;color:var(--muted);margin-left:8px}
  table.stack td:nth-child(3){margin-top:4px;font-size:17px}
  table.stack td:nth-child(4){color:var(--muted);font-size:15px}
  .day-head{padding:22px 20px 0}
  .day-title{font-size:21px}
  .stay{margin:10px 20px 0}
  .day-body{padding:20px;gap:28px}
  .notes{margin:0 20px 20px;padding:16px 18px}
  .tl li{grid-template-columns:56px 14px minmax(0,1fr);column-gap:12px}
  .tl li::after{left:74px}
  .tl .t{font-size:15px}
  .leg{padding:12px 14px;font-size:15px}
  .map-frame{height:300px}
  .check li{grid-template-columns:auto minmax(0,1fr);gap:10px 16px;padding:18px}
  .check .date-blk{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:10px;padding:0 0 10px;border-right:none;border-bottom:1px solid var(--line)}
  .check .date-blk .d{font-size:20px}
  .check .date-blk .s{margin-top:0}
  .check .body{grid-column:2}
  .check input{margin-top:4px}
  .fab{right:12px;bottom:12px}
  .fab-btn{width:44px;height:44px}
}
</style>
</head>
<body>

<div id="app"></div>

<script type="text/x-template" id="tpl">
<div>
  <header class="hero wrap">
    <p class="eyebrow">KYOTO · MAIZURU 2027</p>
    <h1>{{ u.title }}</h1>
    <p class="sub">{{ u.sub }}</p>
    <div class="flights">
      <div class="flight" v-for="f in flights" :key="f.no">
        <div class="lab"><x-icon n="plane"/>{{ f.lab[lang] }}</div>
        <div class="route">
          <div><div class="tm">{{ f.dep }}</div><div class="ap">{{ f.from[lang] }}</div></div>
          <div class="arrow"></div>
          <div style="text-align:right"><div class="tm">{{ f.arr }}</div><div class="ap">{{ f.to[lang] }}</div></div>
        </div>
        <div class="no">{{ u.airline }} {{ f.no }}</div>
      </div>
    </div>
  </header>

  <nav class="days">
    <div class="wrap navrow" ref="navrow">
      <a v-for="n in navItems" :key="n.id" :href="'#'+n.id" :data-id="n.id"
         :class="{active: active === n.id}" @click.prevent="go(n.id)">
        <x-icon v-if="n.icon" :n="n.icon"/>{{ n.label }}
      </a>
    </div>
  </nav>

  <main class="wrap">
    <section id="overview" data-spy>
      <h2><x-icon n="grid"/>{{ u.overview }}</h2>
      <div class="grid2">
        <div class="card pad">
          <div class="tbl-scroll">
            <table>
              <thead><tr><th v-for="h in u.ovTh" :key="h">{{ h }}</th></tr></thead>
              <tbody>
                <tr v-for="d in days" :key="d.id">
                  <td style="white-space:nowrap"><a :href="'#'+d.id" @click.prevent="go(d.id)">{{ dateLabel(d) }}</a></td>
                  <td>{{ d.short[lang] }}</td>
                  <td>{{ d.stay === 'potel' ? 'Potel' : stayName(d) }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card pad">
          <div class="side"><h4><x-icon n="map"/>{{ u.ovMapTitle }}</h4></div>
          <iframe class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" :src="embed(overviewStops)" :title="u.ovMapTitle"></iframe>
          <p class="small" style="margin:12px 0 0">{{ u.ovMapNote }}</p>
        </div>
      </div>
    </section>

    <section id="stay" data-spy>
      <h2><x-icon n="bed"/>{{ u.stayTitle }}</h2>
      <div class="card pad">
        <div class="tbl-scroll">
          <table class="stack">
            <thead><tr><th v-for="h in u.stayTh" :key="h">{{ h }}</th></tr></thead>
            <tbody>
              <tr v-for="(s,i) in stays" :key="i">
                <td>{{ s.nights[lang] }}</td><td>{{ s.date }}</td><td><b>{{ s.name[lang] }}</b></td><td>{{ s.note[lang] }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="small" style="margin:14px 0 0">{{ u.stayNote }}</p>
      </div>
    </section>

    <section v-for="d in days" :key="d.id" :id="d.id" class="card day" data-spy>
      <div class="day-head">
        <span class="day-num">{{ d.n }}</span>
        <span class="day-title">{{ d.title[lang] }}</span>
        <span class="day-date"><x-icon n="calendar"/>{{ dateLabel(d) }}</span>
        <span v-if="d.badge" class="badge" :class="d.badge.cls">{{ d.badge[lang] }}</span>
      </div>
      <div class="stay"><x-icon n="bed"/>{{ u.stayLabel }}<b>{{ stayName(d) }}</b></div>
      <div class="day-body">
        <div>
          <div v-if="d.plans" class="plan-tabs" role="group">
            <button v-for="(p,k) in d.plans" :key="k" type="button" :aria-pressed="plan7 === k" @click="plan7 = k">{{ p.label[lang] }}</button>
          </div>
          <ol class="tl">
            <li v-for="(it,i) in cur(d).timeline" :key="i" :class="{move: it.move}">
              <div class="t">{{ it.move ? '' : txt(it.t) }}</div>
              <div class="what">
                <b><x-icon v-if="it.move" n="route"/>{{ it.title[lang] }}</b>
                <span v-if="it.desc">{{ it.desc[lang] }}</span>
              </div>
            </li>
          </ol>
        </div>
        <div class="side">
          <h4><x-icon n="map"/>{{ u.dayMap }}</h4>
          <iframe class="map-frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" :src="embed(cur(d).map)" :title="d.n"></iframe>
          <h4 style="margin-top:22px"><x-icon n="nav"/>{{ fromHere ? u.dayNavHere : u.dayNav }}</h4>
          <div class="legs">
            <a v-for="(l,i) in cur(d).legs" :key="i" class="leg" :href="navUrl(l)" target="_blank" rel="noopener">
              <span class="m" :class="{walk: l.mode === 'walking'}" :title="u[l.mode] || u.transit">
                <x-icon :n="{ walking: 'walk', driving: 'car' }[l.mode] || 'train'"/>
              </span>
              <span class="lbl">{{ legLabel(l) }}</span>
              <span class="go">{{ u.go }}<x-icon n="ext"/></span>
            </a>
          </div>
        </div>
      </div>
      <div class="notes">

function loadState() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) {}
  if (!s.done) {
    try { s.done = JSON.parse(localStorage.getItem("kyoto2027-checks") || "{}"); } catch (e) { s.done = {}; }
  }
  return s;
}

const app = Vue.createApp({
  template: "#tpl",
  data() {
    const s = loadState();
    return {
      lang: s.lang === "ja" ? "ja" : "zh",
      theme: s.theme || null,
      plan7: s.plan7 === "B" ? "B" : "A",
      fromHere: !!s.fromHere,
      fabOpen: false,
      done: s.done || {},
      scrollY: s.scrollY || 0,
      active: "overview",
      systemDark: matchMedia("(prefers-color-scheme: dark)").matches,
      flights: FLIGHTS, stays: STAYS, days: DAYS, checks: CHECKS, tags: TAGS, tips: TIPS, shops: SHOPS,
      overviewStops: ["京都駅", "天橋立駅", "西舞鶴駅", "東舞鶴駅", "京都駅"],
    };
  },
  computed: {
    u() { return UI[this.lang]; },
    isDark() { return this.theme ? this.theme === "dark" : this.systemDark; },
    navItems() {
      const u = this.u;
      return [
        { id: "overview", label: u.navOverview, icon: "grid" },
        { id: "stay", label: u.navStay, icon: "bed" },
        ...this.days.map(d => ({ id: d.id, label: `${d.n} · ${d.md}` })),
        { id: "shop", label: u.navShop, icon: "bag" },
        { id: "checklist", label: u.navCheck, icon: "check" },
        { id: "tips", label: u.navTips, icon: "bulb" },
      ];
    },
    doneCount() { return this.checks.filter(c => this.done[c.id]).length; },
    checkGroups() {
      return Object.keys(GROUPS).map(key => ({
        key, label: GROUPS[key][this.lang], items: this.checks.filter(c => c.g === key),
      }));
    },
  },
  watch: {
    lang: { handler(v) { document.documentElement.lang = v === "ja" ? "ja" : "zh-Hant"; document.title = this.u.docTitle; this.save(); }, immediate: true },
    theme(v) { this.applyTheme(); this.save(); },
    plan7() { this.save(); },
    fromHere() { this.save(); },
    done: { handler() { this.save(); }, deep: true },
    active(id) { this.centerNav(id); },
  },
  methods: {
    txt(v) { return v && typeof v === "object" ? v[this.lang] : v; },
    dateLabel(d) { return `${d.md}（${this.u.wd[d.wd]}）`; },
    stayName(d) { return STAY_NAMES[d.stay][this.lang]; },
    cur(d) { return d.plans ? d.plans[this.plan7] : d; },
    embed(stops) {
      const e = encodeURIComponent;
      const [first, ...rest] = stops;
      const hl = this.lang === "ja" ? "ja" : "zh-TW";
      return `https://maps.google.com/maps?saddr=${e(first)}&daddr=${rest.map(e).join("+to:")}&hl=${hl}&output=embed`;
    },
    navUrl(l) {
      const e = encodeURIComponent;
      // 省略 origin 時，Google Maps 會用裝置的目前位置當起點
      const origin = this.fromHere ? "" : `&origin=${e(l.from)}`;
      return `https://www.google.com/maps/dir/?api=1${origin}&destination=${e(l.to)}&travelmode=${l.mode}`;
    },
    legLabel(l) {
      const s = l.label[this.lang];
      return this.fromHere ? `${this.u.here} → ${s.split("→").pop().trim()}` : s;
    },
    shopUrl(s) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.q)}&travelmode=transit`;
    },
    go(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    },
    toTop() { window.scrollTo({ top: 0, behavior: "smooth" }); },
    toggleLang() { this.lang = this.lang === "zh" ? "ja" : "zh"; },
    toggleTheme() { this.theme = this.isDark ? "light" : "dark"; },
    applyTheme() {
      if (this.theme) document.documentElement.dataset.theme = this.theme;
      else delete document.documentElement.dataset.theme;
    },
    save() {
      if (this._ready) this.scrollY = Math.round(window.scrollY);
      try {
        localStorage.setItem(STORE, JSON.stringify({
          lang: this.lang, theme: this.theme, plan7: this.plan7, fromHere: this.fromHere, done: this.done, scrollY: this.scrollY,
        }));
      } catch (e) {}
    },
    centerNav(id) {
      const row = this.$refs.navrow;
      if (!row || row.scrollWidth <= row.clientWidth) return;
      const a = row.querySelector(`[data-id="${id}"]`);
      if (a) row.scrollTo({ left: a.offsetLeft - row.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
    },
    onScroll() {
      if (this._t) return;
      this._t = setTimeout(() => { this._t = null; this.save(); }, 300);
    },
  },
  mounted() {
    this.applyTheme();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { this.systemDark = e.matches; });

    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) this.active = en.target.id; });
    }, { rootMargin: "-35% 0px -60% 0px" });
    document.querySelectorAll("[data-spy]").forEach(el => io.observe(el));

    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    const restore = () => { if (this.scrollY > 0) window.scrollTo({ top: this.scrollY, behavior: "instant" }); };
    this.$nextTick(() => {
      restore();
      const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
      Promise.race([fonts, new Promise(r => setTimeout(r, 1200))]).then(() => { restore(); this._ready = true; });
    });
    window.addEventListener("scroll", this.onScroll, { passive: true });
    window.addEventListener("pagehide", this.save);
  },
});

app.component("x-icon", {
  props: { n: String },

  template: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" v-html="p"></svg>',
});

app.mount("#app");
</script>
